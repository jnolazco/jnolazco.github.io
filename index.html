<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jnolazco</title>
    <style>
      /* ── Reset & base ── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #0d2b1a;
        --surface: #1a3d27;
        --border: #30363d;
        --accent: #58a6ff;
        --text: #c9d1d9;
        --text-muted: #8b949e;
        --nav-h: 60px;
      }
      html { scroll-behavior: smooth; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }

      /* ── Navigation ── */
      nav {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: var(--nav-h);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 2rem;
        z-index: 100;
      }
      nav .brand { font-weight: 700; font-size: 1.1rem; color: var(--accent); }
      nav ul { list-style: none; display: flex; gap: 1.5rem; }
      nav ul a {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.95rem;
        transition: color 0.2s;
      }
      nav ul a:hover, nav ul a.active { color: var(--accent); }

      /* ── Sections ── */
      main { padding-top: var(--nav-h); }
      section {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 4rem 2rem;
        max-width: 860px;
        margin: 0 auto;
      }
      section h2 {
        font-size: 2rem;
        margin-bottom: 1rem;
        color: var(--accent);
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.5rem;
      }
      section p { color: var(--text-muted); max-width: 640px; }

      /* ── Hero (About) ── */
      #about h1 { font-size: 2.8rem; margin-bottom: 0.5rem; }
      #about h1 .name { color: var(--accent); }
      #about .subtitle { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 1.5rem; }
      #about .cta {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.6rem 1.4rem;
        background: var(--accent);
        color: var(--bg);
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
        transition: opacity 0.2s;
      }
      #about .cta:hover { opacity: 0.85; }

      /* ── Projects ── */
      .projects-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 1.2rem;
        margin-top: 1.5rem;
      }
      .project-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.2rem;
        transition: border-color 0.2s;
      }
      .project-card:hover { border-color: var(--accent); }
      .project-card h3 { margin-bottom: 0.4rem; font-size: 1rem; }
      .project-card p { font-size: 0.875rem; }
      .project-card a {
        display: inline-block;
        margin-top: 0.8rem;
        font-size: 0.85rem;
        color: var(--accent);
        text-decoration: none;
      }
      .project-card a:hover { text-decoration: underline; }

      /* ── Contact ── */
      .contact-links { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1.2rem; }
      .contact-links a {
        color: var(--accent);
        text-decoration: none;
        font-size: 0.95rem;
        border: 1px solid var(--border);
        padding: 0.4rem 0.9rem;
        border-radius: 6px;
        transition: border-color 0.2s;
      }
      .contact-links a:hover { border-color: var(--accent); }

      /* ── Footer ── */
      footer {
        text-align: center;
        padding: 1.5rem;
        font-size: 0.8rem;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
      }
    </style>
  </head>
  <body>

    <!-- ── Navigation ── -->
    <nav>
      <span class="brand">jnolazco</span>
      <ul>
        <li><a href="#about">Inicio</a></li>
        <li><a href="#projects">Proyectos</a></li>
        <li><a href="#contact">Contacto</a></li>
      </ul>
    </nav>

    <!-- ── Main content ── -->
    <main>

      <!-- About section -->
      <section id="about">
        <div id="about-content">
          <!-- Populated by sections/about.js -->
        </div>
      </section>

      <!-- Projects section -->
      <section id="projects">
        <div id="projects-content">
          <!-- Populated by sections/projects.js -->
        </div>
      </section>

      <!-- Contact section -->
      <section id="contact">
        <div id="contact-content">
          <!-- Populated by sections/contact.js -->
        </div>
      </section>

    </main>

    <footer>
      <p>&copy; <span id="year"></span> jnolazco. Hecho con HTML, CSS y JavaScript.</p>
    </footer>

    <!-- ── Section scripts ── -->
    <script src="sections/about.js"></script>
    <script src="sections/projects.js"></script>
    <script src="sections/contact.js"></script>

    <!-- ── Navigation logic ── -->
    <script>
      // Set current year in footer
      document.getElementById('year').textContent = new Date().getFullYear();

      // Highlight active nav link based on scroll position
      (function () {
        const links = Array.from(document.querySelectorAll('nav ul a'));
        const sections = links.map(function (a) {
          return document.querySelector(a.getAttribute('href'));
        });

        function onScroll() {
          var scrollY = window.scrollY + 80;
          var current = sections[0];
          sections.forEach(function (sec) {
            if (sec && sec.offsetTop <= scrollY) {
              current = sec;
            }
          });
          links.forEach(function (a) {
            a.classList.toggle('active', a.getAttribute('href') === '#' + current.id);
          });
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
      })();
    </script>

  </body>
</html>
